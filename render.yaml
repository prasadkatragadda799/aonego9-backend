databases:
  - name: aonego9-db
    databaseName: aonego9
    plan: free

services:
  - type: web
    name: aonego9-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    branch: main
    # No buildCommand/startCommand — the Dockerfile's ENTRYPOINT
    # (docker/entrypoint.sh) runs migrations, then starts nginx + gunicorn
    # via supervisord. nginx listens on $PORT and reverse-proxies to
    # gunicorn on 127.0.0.1:8000 inside the container.
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: aonego9-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "30"
      - key: CORS_ORIGINS
        # REQUIRED: comma-separated deployed frontend origins, e.g.
        # https://aonego9-user.vercel.app,https://aonego9-vendor.vercel.app,https://aonego9-superadmin.vercel.app
        # Set it in the Render dashboard (Environment tab). "*" is rejected
        # in production by app/core/config.py and the service will not start.
        sync: false
      - key: OTP_DEBUG
        # Must be false in production (config.py refuses to start otherwise);
        # the default is true for local development.
        value: "false"
      - key: ADMIN_EMAIL
        value: admin@aonego9.com
      - key: ADMIN_PASSWORD
        # sync: false keeps this out of render.yaml/git — set the real
        # fixed superadmin password by hand in the Render dashboard
        # (Environment tab). The account is auto-created on first boot
        # with whatever's set here; falls back to "demo1234" if unset.
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
